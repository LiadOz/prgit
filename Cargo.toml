[package]
name = "prgit"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cargo-llvm-cov = "0.6.21"
chrono = { version = "0.4", features = ["serde"] }
derive_setters = "0.1.8"
git2 = "0.20.2"
log = "0.4.29"
p4-cmd = "0.1.0"
serde = "1.0.228"
serde_json = "1.0.145"
serde_with = { version = "3.16.1", features = ["chrono"] }
thiserror = "2.0.17"

[dev-dependencies]
env_logger = "0.11.8"
test-log = "0.2.19"
