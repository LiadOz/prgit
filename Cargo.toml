[workspace]
members = ["crates/p4rs"]

[package]
name = "prgit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "prgit-server"
path = "src/bin/server.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11.8"
git2 = "0.20.2"
keyring = "3"
libc = "0.2"
log = "0.4.29"
p4rs = { path = "crates/p4rs" }
rusqlite = { version = "0.35", features = ["bundled"] }
tempfile = "3.24.0"
regex = "1"
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }

anyhow = "1"

# Server dependencies
axum = "0.8"
base64 = "0.22"
gix-packetline = "0.21"
httparse = "1.10"
hyper = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
cargo-llvm-cov = "0.6.21"
p4rs = { path = "crates/p4rs", features = ["testkit"] }
test-log = "0.2.19"
tokio-util = "0.7"

[features]
testkit-local = ["p4rs/testkit-local"]
