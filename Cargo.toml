[workspace]
members = ["crates/p4rs"]

[package]
name = "prgit"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11.8"
git2 = "0.20.2"
log = "0.4.29"
p4rs = { path = "crates/p4rs" }
rusqlite = { version = "0.35", features = ["bundled"] }
tempfile = "3.24.0"
thiserror = "2.0"

[dev-dependencies]
cargo-llvm-cov = "0.6.21"
test-log = "0.2.19"
p4rs = { path = "crates/p4rs", features = ["testkit"] }
