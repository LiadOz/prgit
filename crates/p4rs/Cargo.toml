[package]
name = "p4rs"
version = "0.1.0"
edition = "2021"
description = "A Rust client library for Perforce (Helix Core)"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
derive_setters = "0.1.8"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = { version = "3.16.1", features = ["chrono"] }
thiserror = "2.0.17"

[features]
extensible = []

[dev-dependencies]
env_logger = "0.11.8"
test-log = "0.2.19"
testcontainers = "0.23"
p4rs = { path = ".", features = ["extensible"] }
tempfile = "3.24.0"

