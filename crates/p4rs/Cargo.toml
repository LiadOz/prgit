[package]
name = "p4rs"
version = "0.1.0"
edition = "2021"
description = "A Rust client library for Perforce (Helix Core)"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
derive_setters = "0.1.8"
log = "0.4.29"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = { version = "3.16.1", features = ["chrono"] }
thiserror = "2.0.17"

[features]
extensible = []
testkit = ["dep:testcontainers", "dep:tempfile", "dep:uuid"]

[dependencies.testcontainers]
version = "0.23"
features = ["blocking"]
optional = true

[dependencies.tempfile]
version = "3.24.0"
optional = true

[dependencies.uuid]
version = "1"
features = ["v4"]
optional = true

[dev-dependencies]
env_logger = "0.11.8"
test-log = "0.2.19"
p4rs = { path = ".", features = ["extensible", "testkit"] }

