[project]
name = "prgit"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Liad Oz", email = "liadozil@gmail.com" }
]
dependencies = [
    "gitpython>=3.1.45",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.4.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/prgit"]
